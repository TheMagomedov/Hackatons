services:
  marketer:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      MINI_APP_HOST: 0.0.0.0
      MINI_APP_PORT: 8766
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - marketer-data:/data
      - marketer-backups:/backups
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "app.ops.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  marketer-data:
  marketer-backups:
